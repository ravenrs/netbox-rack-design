---
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.14.14

      - name: Run Ruff
        run: ruff check netbox_rack_design/

  test:
    name: Test (NetBox ${{ matrix.netbox-version }} / Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    # The declared min_version/max_version range (4.4.0 - 4.6.99) is only honest if
    # CI tests BOTH ends of it plus the minor in between, so NetBox is a matrix
    # dimension. Deliberately a sparse `include` rather than a full cross product:
    # the newest NetBox gets the whole Python sweep, the older ones only their
    # supported edges. fail-fast is off so one bad pair cannot mask the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - netbox-version: 'v4.4.8'
            python-version: '3.12'
          - netbox-version: 'v4.4.8'
            python-version: '3.14'
          - netbox-version: 'v4.5.10'
            python-version: '3.12'
          - netbox-version: 'v4.5.10'
            python-version: '3.14'
          - netbox-version: 'v4.6.8'
            python-version: '3.12'
          - netbox-version: 'v4.6.8'
            python-version: '3.13'
          - netbox-version: 'v4.6.8'
            python-version: '3.14'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clone NetBox ${{ matrix.netbox-version }}
        run: |
          git clone --depth 1 --branch ${{ matrix.netbox-version }} https://github.com/netbox-community/netbox.git

      - name: Install NetBox dependencies
        working-directory: netbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install plugin
        working-directory: plugin
        run: |
          pip install -e . --no-deps

      - name: Configure NetBox
        working-directory: netbox/netbox
        run: |
          cp ../../plugin/testing/configuration.py netbox/configuration.py

      - name: Run database migrations
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py migrate --no-input

      - name: Check for missing migrations
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py makemigrations --check netbox_rack_design

      - name: Collect static files
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py collectstatic --no-input

      - name: Run tests
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py test netbox_rack_design.tests --parallel --keepdb -v 2
